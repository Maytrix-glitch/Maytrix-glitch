name: Pull and Publish RSS Feed

on:
  schedule:
    # This runs the automation automatically every day at midnight (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # This allows you to run it manually anytime

permissions:
  contents: write

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch RSS Feed
        uses: Promptly-Technologies-LLC/rss-feed-action@v2
        with:
          feed_url: 'https://cramerlaw.co.nz/feed/'
          output_file: 'feed.json'

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated RSS feed update"
