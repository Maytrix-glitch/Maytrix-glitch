name: Pull and Publish RSS Feed

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Browser Automation Tool
        run: |
          pip install playwright
          playwright install chromium

      - name: Fetch Feed Passing Security Challenge
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          import time

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              
              # Target the direct WordPress post articles database feed layout
              page.goto('https://cramerlaw.co.nz')
              
              # Explicitly wait 10 seconds to clear the screening script completely
              time.sleep(10)
              
              # Extract the fully loaded XML content behind the firewall page
              content = page.content()
              
              with open('feed.xml', 'w', encoding='utf-8') as f:
                  f.write(content)
                  
              browser.close()
          "

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated RSS feed update"
