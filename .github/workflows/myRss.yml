name: Pull and Publish RSS Feed

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch Feed Bypassing Firewall
        run: |
          python -c "
          import requests
          url = 'https://cramerlaw.co.nz'
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8',
              'Accept-Language': 'en-US,en;q=0.5'
          }
          session = requests.Session()
          # First request to establish session and cookies
          session.get('https://cramerlaw.co.nz', headers=headers)
          # Second request to pull the pure RSS XML data
          response = session.get(url, headers=headers)
          with open('feed.xml', 'w', encoding='utf-8') as f:
              f.write(response.text)
          "

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated RSS feed update"
